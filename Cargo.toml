[package]
name = "rtdb-sync"
version = "0.1.0"
edition = "2021"
description = "Realtime synchronized Rust state for Firebase Realtime Database"
license = "MIT"
repository = "https://github.com/kab102395/rtdb-sync"
keywords = ["firebase", "rtdb", "realtime", "sync", "async"]
categories = ["database", "asynchronous", "web-programming"]
rust-version = "1.78"

[dependencies]
async-trait = "0.1"
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-util = "0.7"

[dev-dependencies]
