[package]
name = "rtdb-sync"
version = "0.4.0"
edition = "2021"
description = "Realtime synchronized Rust state for Firebase Realtime Database"
license = "MIT"
repository = "https://github.com/kab102395/rtdb-sync"
keywords = ["firebase", "rtdb", "realtime", "sync", "async"]
categories = ["database", "asynchronous", "web-programming"]
rust-version = "1.85"
readme = "README.md"
documentation = "https://docs.rs/rtdb-sync"

[dependencies]
async-trait = "0.1"
rtdb-rs = "0.3.2"
rtdb-typed = "0.3.0"
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-util = "0.7"

[dev-dependencies]
rtdb-admin = { version = "0.1.0", features = ["rtdb-client"] }
