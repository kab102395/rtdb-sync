name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      # The coordinated release gate runs cargo package/publish dry-run after
      # rtdb-rs 0.3.2 is published. Until then crates.io cannot resolve that
      # intentionally pinned upstream version; keep clean-checkout CI focused
      # on the source, lint, test, and documentation graph.
